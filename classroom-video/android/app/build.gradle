plugins { id 'com.android.application' }

android {
    namespace 'jp.stepkobetsu.classroomvideo'
    compileSdk 35
    defaultConfig {
        applicationId 'jp.stepkobetsu.classroomvideo'
        minSdk 22
        targetSdk 28
        versionCode 10
        versionName '0.2.7-fire'
        buildConfigField 'String', 'APP_URL', '"https://step-classroom-video.stepkobetsu.workers.dev/"'
    }
    buildFeatures { buildConfig true }
    lint { disable 'ExpiredTargetSdkVersion' }
    signingConfigs {
        debug {
            v1SigningEnabled true
            v2SigningEnabled true
        }
        fireRelease {
            def keystorePath = System.getenv('STEP_VIDEO_KEYSTORE')
            if (keystorePath) {
                storeFile file(keystorePath)
                storeType 'PKCS12'
                storePassword System.getenv('STEP_VIDEO_STORE_PASSWORD')
                keyAlias System.getenv('STEP_VIDEO_KEY_ALIAS')
                keyPassword System.getenv('STEP_VIDEO_KEY_PASSWORD')
                v1SigningEnabled true
                v2SigningEnabled true
            }
        }
    }
    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            if (System.getenv('STEP_VIDEO_KEYSTORE')) signingConfig signingConfigs.fireRelease
            minifyEnabled false
        }
    }
}
