<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
  <meta name="theme-color" content="#102a43">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="stylesheet" href="/style.css">
  <title>STEP 教室ビデオ</title>
</head>
<body>
  <main id="app">
    <section id="setup" class="panel hidden" aria-labelledby="setup-title">
      <h1 id="setup-title">端末の初期設定</h1>
      <p>この端末を自動登録しています。IDやトークンの入力は不要です。</p>
      <label class="hidden">端末ID<input id="device-id" autocomplete="off"></label>
      <label class="hidden">端末トークン<input id="device-token" type="password" autocomplete="off"></label>
      <label class="hidden">連続動作時間
        <select id="duration-hours">
          <option value="5">5時間</option><option value="6" selected>6時間（標準）</option>
          <option value="7">7時間</option><option value="8">8時間</option>
          <option value="9">9時間</option><option value="10">10時間</option>
          <option value="11">11時間</option><option value="12">12時間</option>
        </select>
      </label>
      <button id="save-setup" class="primary">自動登録を再試行</button>
      <p id="setup-error" class="error" role="alert"></p>
    </section>

    <section id="rest" class="rest hidden" role="button" tabindex="0" aria-label="休止中。起動するには画面をタップしてください。">
      <strong>休止中</strong>
      <span>起動するには画面をタップしてください。</span>
    </section>

    <section id="home" class="home hidden">
      <div class="brand">STEP 教室ビデオ</div>
      <div id="device-name" class="device-name"></div>
      <button id="connect" class="connect-button">教室をつなぐ</button>
      <p id="home-message">1回押すだけで相手教室につながります</p>
    </section>

    <section id="call" class="call hidden">
      <div id="empty-state" class="empty-state">接続相手を待っています</div>
      <div id="remote-grid" class="remote-grid" aria-label="相手映像"></div>
      <figure id="local-tile" class="local-tile"><video id="local-video" autoplay playsinline muted></video><figcaption id="local-name">この端末</figcaption></figure>
      <header><span id="status-dot"></span><span id="status">接続中</span><strong id="featured-name" class="featured-name"></strong><strong id="peer-summary">相手を待っています</strong><strong id="featured-mic-off" class="featured-mic-off hidden">🎤 マイク OFF</strong></header>
      <div id="notice" class="notice hidden" role="status"></div>
      <div id="incoming" class="incoming hidden">
        <div id="incoming-text">呼び出しです</div>
        <button id="ack">確認</button>
      </div>
      <section id="call-target-picker" class="target-picker hidden" aria-labelledby="call-target-title">
        <h2 id="call-target-title">呼び出す端末を選択</h2>
        <div id="call-target-list" class="target-list"></div>
        <button id="call-target-cancel">キャンセル</button>
      </section>
      <nav id="controls" aria-label="通話操作">
        <button id="mic" aria-pressed="true"><span>🎙</span><b>マイク ON</b></button>
        <button id="camera" aria-pressed="true"><span class="video-icon" aria-hidden="true"></span><b>カメラ ON</b></button>
        <button id="alert" class="alert"><span>🔔</span>呼び出す</button>
        <button id="settings-button"><span>⚙</span>設定</button>
        <button id="hangup" class="danger"><span>✕</span><b>終了</b><small>2回：再起動／3回：完全終了</small></button>
      </nav>
      <section id="settings" class="settings hidden" aria-labelledby="settings-title">
        <h2 id="settings-title">端末設定</h2>
        <p>端末：<strong id="settings-device"></strong></p>
        <label>内部端末ID（自動発行・変更不可）
          <input id="settings-tablet-name" readonly>
        </label>
        <label>画面に表示する端末名
          <input id="settings-display-name" autocomplete="off" maxlength="24" placeholder="管理者スマホ">
        </label>
        <label>操作バー表示時間
          <select id="settings-controls-timeout">
             <option value="3">3秒</option><option value="5" selected>5秒（標準）</option>
            <option value="8">8秒</option><option value="10">10秒</option>
            <option value="15">15秒</option><option value="0">常時表示</option>
          </select>
        </label>
        <label>映像の優先設定
          <select id="settings-quality-mode">
            <option value="smooth" selected>滑らかさ優先（標準・推奨）</option>
            <option value="quality">画質優先</option>
          </select>
        </label>
        <label class="check-label"><input id="settings-show-self" type="checkbox" checked> 自分映像を表示</label>
        <label>次回からの連続運転時間
          <select id="settings-duration">
            <option value="5">5時間</option><option value="6">6時間（標準）</option>
            <option value="7">7時間</option><option value="8">8時間</option>
            <option value="9">9時間</option><option value="10">10時間</option>
            <option value="11">11時間</option><option value="12">12時間</option>
          </select>
        </label>
         <div class="settings-actions">
           <button id="chime-test">呼び出し音テスト</button>
           <button id="diagnostics-toggle">診断</button>
           <button id="settings-save" class="primary">保存</button>
           <button id="settings-close">閉じる</button>
         </div>
         <pre id="diagnostics" class="diagnostics hidden" aria-live="polite"></pre>
         <button id="reset-device" class="reset-device">端末設定をリセット</button>
      </section>
    </section>
  </main>
  <script src="/app.js" defer></script>
</body>
</html>
