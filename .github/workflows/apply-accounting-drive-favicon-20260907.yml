name: Apply accounting Drive favicon 20260907

on:
  push:
    paths:
      - '.github/workflows/apply-accounting-drive-favicon-20260907.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch accounting favicon implementation
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          code = Path('accounting-login-app/Code.gs')
          text = code.read_text(encoding='utf-8')

          # Replace the external favicon constant with a Drive-backed helper.
          text = text.replace(
              "const FAVICON_URL = 'https://stepkobetsu-hub.github.io/step-system-registry/images/accounting-login-favicon.png';\n",
              "const FAVICON_SOURCE_URL = 'https://stepkobetsu-hub.github.io/step-system-registry/images/accounting-login-favicon-v2.png';\nconst FAVICON_FILE_ID_KEY = 'ACCOUNTING_FAVICON_DRIVE_FILE_ID';\n"
          )
          text = text.replace(
              ".setFaviconUrl(FAVICON_URL)\n",
              ".setFaviconUrl(getFaviconUrl_())\n"
          )

          helper = r'''
function getFaviconUrl_() {
  const props = PropertiesService.getScriptProperties();
  let fileId = props.getProperty(FAVICON_FILE_ID_KEY);
  if (!fileId) {
    const response = UrlFetchApp.fetch(FAVICON_SOURCE_URL, { muteHttpExceptions: false });
    const blob = response.getBlob().setName('accounting-login-favicon.png');
    const file = DriveApp.createFile(blob);
    file.setSharing(DriveApp.Access.ANYONE_WITH_LINK, DriveApp.Permission.VIEW);
    fileId = file.getId();
    props.setProperty(FAVICON_FILE_ID_KEY, fileId);
  }
  return 'https://drive.google.com/uc?id=' + encodeURIComponent(fileId) + '&.png';
}

'''
          if 'function getFaviconUrl_()' not in text:
              marker = 'function setupSpreadsheet() {'
              if marker not in text:
                  raise SystemExit('setupSpreadsheet marker not found')
              text = text.replace(marker, helper + marker, 1)

          code.write_text(text, encoding='utf-8')

          readme = Path('accounting-login-app/README.md')
          md = readme.read_text(encoding='utf-8')
          note = '''\n## ファビコン\n\n- 経理ログイン管理専用の青い「￥＋帳簿」PNGを使用します。\n- 初回アクセス時にApps Scriptが画像をGoogle Driveへコピーし、「リンクを知っている全員（閲覧者）」として公開します。\n- `setFaviconUrl()` には `https://drive.google.com/uc?id=...&.png` 形式を渡します。\n- DriveファイルIDはScript Propertiesの `ACCOUNTING_FAVICON_DRIVE_FILE_ID` に保存するため、毎回ファイルは作成しません。\n'''
          if '## ファビコン' not in md:
              md += note
              readme.write_text(md, encoding='utf-8')
          PY
      - name: Commit favicon implementation
        shell: bash
        run: |
          rm -f .github/workflows/apply-accounting-drive-favicon-20260907.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add accounting-login-app/Code.gs accounting-login-app/README.md .github/workflows/apply-accounting-drive-favicon-20260907.yml
          git commit -m 'Use Drive-backed favicon for accounting login'
          git push
