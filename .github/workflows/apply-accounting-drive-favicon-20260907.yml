name: Apply accounting Drive favicon 20260907

on:
  push:
    paths:
      - '.github/workflows/apply-accounting-drive-favicon-20260907.yml'
      - 'scripts/apply-accounting-drive-favicon.py'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch accounting favicon implementation
        run: python scripts/apply-accounting-drive-favicon.py
      - name: Commit favicon implementation
        run: |
          rm -f .github/workflows/apply-accounting-drive-favicon-20260907.yml scripts/apply-accounting-drive-favicon.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --quiet || git commit -m 'Use Drive-backed favicon for accounting login'
          git push
