name: Patch grade management labels 20260903
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/patch-grade-labels-20260903.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update registry labels
        shell: python
        run: |
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          replacements = {
              '生徒用 成績管理（Supabase移行済み）': '生徒用 成績管理',
              '講師・管理者用 成績管理（PR #16マージ後に移行版へ切替）': '管理者・講師用 成績管理',
              '講師・管理者用 成績管理を開く': '管理者・講師用 成績管理',
          }
          changed = False
          for old, new in replacements.items():
              if old in s:
                  s = s.replace(old, new)
                  changed = True
          if not changed:
              raise SystemExit('Expected labels not found')
          p.write_text(s, encoding='utf-8')
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "成績管理の表示名を整理" || exit 0
          git push
