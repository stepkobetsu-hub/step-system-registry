name: Record invoice and delivery updates

on:
  push:
    branches: [main]
    paths:
      - 'scripts/record_invoice_delivery_20260904.py'
      - '.github/workflows/record-invoice-delivery-20260904.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update registry records
        run: python3 scripts/record_invoice_delivery_20260904.py
      - name: Basic checks
        run: |
          grep -q 'Apps Script v85' SYSTEM_REGISTRY.md
          grep -q 'invoice-delivery-bounce-20260904' index.html
          grep -q '一時停止（自動）' index.html
      - name: Commit registry changes
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add SYSTEM_REGISTRY.md index.html
          git commit -m 'Record invoice and delivery failure updates'
          git push
