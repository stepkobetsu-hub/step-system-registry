name: Fix grade admin direct link

on:
  push:
    paths:
      - '.github/workflows/fix-grade-admin-direct-link.yml'

permissions:
  contents: write

jobs:
  fix-ledger:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Make grade entry links explicit
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('index.html')
          text = p.read_text(encoding='utf-8')
          old = "function appendDailyLinks(item,article){const section=el('section','daily-links');section.append(el('h3','','日常利用'));const used=new Set();const qrRegisterUrl="
          new = "function appendDailyLinks(item,article){const section=el('section','daily-links');section.append(el('h3','','日常利用'));const used=new Set();if(isGradeSystem(item)){const studentUrl='https://stepkobetsu-hub.github.io/seiseki-kanri/juku_app.html';const adminUrl='https://stepkobetsu-hub.github.io/seiseki-kanri/admin.html';section.append(linkRow('生徒用 成績管理を開く',studentUrl),linkRow('講師・管理者用 成績管理を開く',adminUrl));used.add(studentUrl);used.add(adminUrl);}const qrRegisterUrl="
          if text.count(old) != 1:
              raise SystemExit(f'unexpected appendDailyLinks match count: {text.count(old)}')
          text = text.replace(old, new)
          p.write_text(text, encoding='utf-8')

          final = p.read_text(encoding='utf-8')
          for s in [
              "linkRow('生徒用 成績管理を開く',studentUrl)",
              "linkRow('講師・管理者用 成績管理を開く',adminUrl)",
              "const adminUrl='https://stepkobetsu-hub.github.io/seiseki-kanri/admin.html'",
          ]:
              if s not in final:
                  raise SystemExit(f'missing verification: {s}')
          PY
          git diff --check

      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "成績管理の生徒・講師管理者入口を必ず表示"
          git push origin HEAD:main
