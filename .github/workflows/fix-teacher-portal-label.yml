name: Fix teacher portal label
on:
  push:
    paths:
      - .github/fix-teacher-portal-label.trigger
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore registry index and patch label
        run: |
          git checkout debc85addd9abb02fbbe8bd9b3f61d10fb1fd53a -- index.html
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          old = "section.append(linkRow(linkLabel(item,field,fallback||fieldLabel(field)),linkUrl(item,field,value)));"
          new = "const displayLabel=(String(item['システム名']||'').includes('講師ポータル')&&field==='利用者向けURL')?'講師ポータルアプリ':linkLabel(item,field,fallback||fieldLabel(field));section.append(linkRow(displayLabel,linkUrl(item,field,value)));"
          if old not in s:
              raise SystemExit('target string not found')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
          PY
          rm -f .github/fix-teacher-portal-label.trigger
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+users.noreply.github.com'
          git add index.html .github/fix-teacher-portal-label.trigger .github/workflows/fix-teacher-portal-label.yml
          git commit -m 'fix: rename teacher portal app label'
          git push
