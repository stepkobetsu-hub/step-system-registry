name: Update Foresta V3 fast registry
on:
  push:
    branches: [main]
    paths:
      - scripts/patch-foresta-v3-fast-registry.py
      - .github/workflows/patch-foresta-v3-fast-registry.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - run: python scripts/patch-foresta-v3-fast-registry.py
      - name: Commit registry update and cleanup
        run: |
          rm -f scripts/patch-foresta-v3-fast-registry.py .github/workflows/patch-foresta-v3-fast-registry.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Record Foresta V3 fast runtime staging"
          git push origin HEAD:main
