name: Enable registry editor
on:
  push:
    paths:
      - .github/enable-registry-editor-20260903.trigger
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Enable workspace-style editor
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          tag='<script src="registry-editor.js?v=20260903-1"></script>'
          if tag not in s:
              if '</body>' not in s:
                  raise SystemExit('closing body not found')
              s=s.replace('</body>', tag+'\n</body>', 1)
              p.write_text(s, encoding='utf-8')
          PY
          rm -f .github/enable-registry-editor-20260903.trigger
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+users.noreply.github.com'
          git add index.html .github/enable-registry-editor-20260903.trigger
          if ! git diff --cached --quiet; then
            git commit -m 'feat: enable registry editing controls'
            git push
          fi
