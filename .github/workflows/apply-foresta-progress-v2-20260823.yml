name: Apply Foresta three-round registry update

on:
  push:
    branches: [main]
    paths:
      - scripts/apply-foresta-progress-v2-20260823.mjs

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply registry patch
        run: node scripts/apply-foresta-progress-v2-20260823.mjs
      - name: Verify marker and documentation link
        run: |
          grep -q 'foresta-progress-v2-three-rounds-20260823' index.html
          grep -q 'foresta-progress-v2-three-rounds-20260823.md' index.html
          grep -q 'saveStudentRoundProgress' index.html
      - name: Commit registry update
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- index.html; then
            echo 'No registry changes.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Update Foresta registry for three-round production release'
          git push origin HEAD:main
