name: Refine registry daily links editor
on:
  push:
    paths:
      - .github/refine-registry-daily-links-20260903.trigger
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Refine and check daily links editor
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('registry-daily-links-editor.js')
          s=p.read_text(encoding='utf-8')
          s=s.replace("  let saving=false;\n", "  let saving=false;\n  let dirtySinceSharedLoad=false;\n", 1)
          old="""      let section=article.querySelector('.daily-links');\n      if(hasOverride(key)){\n        section=ensureDailySection(article);\n        section.querySelectorAll('.link-row,.registry-daily-empty').forEach(node=>node.remove());\n        const links=config.cards[key];\n        links.forEach(link=>section.append(createCustomLinkRow(link)));\n        if(!links.length){const empty=document.createElement('p');empty.className='meta registry-daily-empty';empty.textContent='日常利用リンクはありません。';section.append(empty);}\n      }\n      if(!section)return;\n"""
          new="""      let section=article.querySelector('.daily-links');\n      if(!section)section=ensureDailySection(article);\n      if(hasOverride(key)){\n        section.querySelectorAll('.link-row,.registry-daily-empty').forEach(node=>node.remove());\n        const links=config.cards[key];\n        links.forEach(link=>section.append(createCustomLinkRow(link)));\n        if(!links.length){const empty=document.createElement('p');empty.className='meta registry-daily-empty';empty.textContent='日常利用リンクはありません。';section.append(empty);}\n      }else if(!section.querySelector('.link-row')&&!section.querySelector('.registry-daily-empty')){\n        const empty=document.createElement('p');empty.className='meta registry-daily-empty';empty.textContent='日常利用リンクはありません。';section.append(empty);\n      }\n"""
          if old not in s: raise SystemExit('decorate target not found')
          s=s.replace(old,new,1)
          old2="""      if(remote){config=normalizeConfig(remote);persistLocal();render();setSync('全パソコンで共有中','ready');}\n      else setSync('編集内容は保存時に全パソコンへ共有されます','local');\n"""
          new2="""      if(remote&&!dirtySinceSharedLoad){config=normalizeConfig(remote);persistLocal();render();setSync('全パソコンで共有中','ready');}\n      else if(remote){setSync('この端末の変更を保存待ちです','saving');}\n      else setSync('編集内容は保存時に全パソコンへ共有されます','local');\n"""
          if old2 not in s: raise SystemExit('shared target not found')
          s=s.replace(old2,new2,1)
          s=s.replace("      setSync(`全パソコンへ保存しました（版 ${saved.version||expectedVersion+1}）`,'ready');", "      dirtySinceSharedLoad=false;setSync(`全パソコンへ保存しました（版 ${saved.version||expectedVersion+1}）`,'ready');", 1)
          s=s.replace("document.getElementById('registryDailyPanel').classList.remove('hidden');document.body.style.overflow='hidden';loadShared();", "document.getElementById('registryDailyPanel').classList.remove('hidden');document.body.style.overflow='hidden';", 1)
          s=s.replace("    config.cards[editingKey]=normalized;persistLocal();render();scheduleSharedSave();", "    config.cards[editingKey]=normalized;dirtySinceSharedLoad=true;persistLocal();render();scheduleSharedSave();", 1)
          s=s.replace("    delete config.cards[editingKey];persistLocal();render();scheduleSharedSave();closeEditor();", "    delete config.cards[editingKey];dirtySinceSharedLoad=true;persistLocal();render();scheduleSharedSave();closeEditor();", 1)
          p.write_text(s,encoding='utf-8')
          PY
          node --check registry-daily-links-editor.js
          rm -f .github/refine-registry-daily-links-20260903.trigger
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+users.noreply.github.com'
          git add registry-daily-links-editor.js .github/refine-registry-daily-links-20260903.trigger
          git commit -m 'fix: make daily-use link editing robust'
          git push
