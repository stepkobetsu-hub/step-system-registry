name: Update learning progress registry 20260822

on:
  pull_request:
    branches: [main]
    paths:
      - '.learning-progress-registry-trigger'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Update registry files
        shell: bash
        run: |
          node <<'NODE'
          const fs=require('fs');
          const url='https://step-progress-api.stepkobetsu.workers.dev/';
          const version='fb49bfc7-73e9-4361-84ef-ef07768d1c27';
          const previous='df2838bf-7292-4f4b-a750-951e0e644084';
          const doc='docs/learning-progress-v3-stabilized-20260822.md';

          let md=fs.readFileSync('SYSTEM_REGISTRY.md','utf8');
          const row=`| ステップ＆ゴール進捗管理 | **V3本番稼働中（D1直保存・旧進捗復元済み）** | ${url} | [foresta-step-progress](https://github.com/stepkobetsu-hub/foresta-step-progress) | \`codex/homework-status-root-cause\`（現行本番）／\`agent/step-progress-v3-implementation\`（V3基礎） | \`cloudflare/src/v3.ts\`、\`cloudflare/src/dashboard.ts\`、\`cloudflare/src/summary.ts\`、\`cloudflare/scripts/apply-v3-homework-display-fix.mjs\`、D1 V3テーブル | GitHub＋Cloudflare Worker＋D1 \`step-progress-db\`。通常保存はD1直保存。旧Supabaseは復元元として保全 | 1320で最小確認。代表5名を旧スクショと本番APIで照合。進捗・目標・宿題件数とhealthを確認して本番反映 | 2026-08-22 | 現行Version \`${version}\`。直前Version \`${previous}\`。V3直前旧版 \`7b84a8f6-3b25-4052-ab32-f02d6af55a51\`。詳細 \`${doc}\` |`;
          const lines=md.split(/\r?\n/);
          const idx=lines.findIndex(line=>line.startsWith('| ステップ＆ゴール進捗管理 |'));
          if(idx<0)throw new Error('registry row not found');
          lines[idx]=row;
          md=lines.join('\n');
          fs.writeFileSync('SYSTEM_REGISTRY.md',md);

          const data=JSON.parse(fs.readFileSync('workspace-apps.json','utf8'));
          const app=data.apps.find(x=>x['正式名称']==='ステップ＆ゴール進捗管理');
          if(!app)throw new Error('workspace export app not found');
          app['状態']='V3本番稼働中（D1直保存・旧進捗復元済み）';
          app['利用者向けURL']=url;
          data.generatedAt='2026-08-22';
          fs.writeFileSync('workspace-apps.json',JSON.stringify(data,null,2)+'\n');

          let html=fs.readFileSync('index.html','utf8');
          const marker='learning-progress-v3-stabilized-20260822';
          if(!html.includes(marker)){
            const script=`\n<script id="${marker}">\nconst applyLearningProgressV3Stabilized20260822Base=applyAssetInfo;\napplyAssetInfo=function(item){\n  const base=applyLearningProgressV3Stabilized20260822Base(item);\n  const name=String(base['システム名']||base['正式名称']||'');\n  if(!(base['ID']==='learning-progress'||name.includes('ステップ＆ゴール進捗管理')||name.includes('学習進捗管理')))return base;\n  const confirmed=Array.isArray(base['確認済み事項'])?base['確認済み事項']:[];\n  return Object.assign({},base,{\n    'システム名':'ステップ＆ゴール進捗管理',\n    '正式名称':'ステップ＆ゴール進捗管理',\n    '状態':'V3本番稼働中（D1直保存・旧進捗復元済み）',\n    '利用者向けURL':'${url}',\n    'Cloudflare Worker':'step-progress-api',\n    'D1':'step-progress-db（database ID 028f097c-2609-4bf7-9e9b-39b565606941）',\n    '本番Version':'${version}',\n    '直前Version':'${previous}',\n    '本番ブランチ':'codex/homework-status-root-cause（現行本番）',\n    'V3基礎ブランチ':'agent/step-progress-v3-implementation',\n    '確認日':'2026年8月22日',\n    '概要':'Cloudflare D1直保存のV3。旧Supabaseの正しい目標範囲・学習進捗を復元し、宿題チェックはチェックボックス方式。未チェックは「チェック」、チェック後は「宿題済み」。',\n    '詳細記録':'${doc}',\n    '確認済み事項':[...new Set([...confirmed,'本番URLをstep-progress-apiへ固定','本番health: 生徒34・進捗3540・目標6555・宿題2271','旧スクショとの代表5名照合一致','1100:121/70','1097:55/112','1214:181/288','1276:293/581','1312:133/420','宿題2,271件の旧/V3 status監査で欠落・不一致0','生徒宿題チェックON=DECLARED_DONE／OFF=UNINPUT','先生確認済み後のみ生徒変更ロック'])]\n  });\n};\n</script>\n`;
            if(!html.includes('</body>'))throw new Error('body end not found');
            html=html.replace('</body>',script+'</body>');
          }
          fs.writeFileSync('index.html',html);
          NODE
      - name: Verify
        run: |
          grep -q 'fb49bfc7-73e9-4361-84ef-ef07768d1c27' SYSTEM_REGISTRY.md
          grep -q 'learning-progress-v3-stabilized-20260822' index.html
          grep -q 'V3本番稼働中（D1直保存・旧進捗復元済み）' workspace-apps.json
          grep -q 'https://step-progress-api.stepkobetsu.workers.dev/' workspace-apps.json
      - name: Commit
        run: |
          git config user.name 'stepkobetsu-hub'
          git config user.email 'stepkobetsu@gmail.com'
          git add SYSTEM_REGISTRY.md workspace-apps.json index.html
          git diff --cached --quiet && exit 0
          git commit -m 'Update learning progress V3 links and registry details'
          git push origin HEAD:main
