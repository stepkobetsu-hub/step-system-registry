name: Build Digital Calendar Windows app

on:
  push:
    paths:
      - "windows-calendar/**"
      - ".github/workflows/build-digital-calendar-windows.yml"
  pull_request:
    paths:
      - "windows-calendar/**"
      - ".github/workflows/build-digital-calendar-windows.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    if: ${{ !contains(github.event.head_commit.message, '[skip windows build]') }}
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Build installer
        shell: powershell
        run: .\windows-calendar\build-windows.ps1
      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: DigitalCalendarSetup
          path: downloads/DigitalCalendarSetup.exe
      - name: Publish direct download file
        if: github.event_name == 'push'
        shell: powershell
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f downloads/DigitalCalendarSetup.exe
          if (-not (git diff --cached --quiet)) {
            git commit -m "Publish Windows calendar installer [skip windows build]"
            git push
          }
