name: Temporary add teacher app link
on:
  push:
    paths:
      - .github/trigger-teacher-app-link.txt
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch index.html
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          old = "if(String(item['システム名']||'').includes('講師ポータル')){const staffAppUrl='https://stepkobetsu-hub.github.io/seiseki-kanri/';section.append(linkRow('スタッフ用アプリ',staffAppUrl));used.add(staffAppUrl);}"
          new = "if(String(item['システム名']||'').includes('講師ポータル')){const staffAppUrl='https://stepkobetsu-hub.github.io/seiseki-kanri/';const teacherAppUrl='https://stepkobetsu-hub.github.io/teacher_schedule/teacher_app.html';section.append(linkRow('スタッフ用アプリ',staffAppUrl),linkRow('講師アプリ',teacherAppUrl));used.add(staffAppUrl);used.add(teacherAppUrl);}"
          if old not in s:
              raise SystemExit('target string not found')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Remove trigger
        run: rm -f .github/trigger-teacher-app-link.txt
      - name: Commit changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html .github/trigger-teacher-app-link.txt
          git diff --cached --quiet || git commit -m 'feat: add teacher app link to teacher portal card'
          git push
