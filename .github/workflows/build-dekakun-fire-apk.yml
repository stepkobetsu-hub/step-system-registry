name: Build Dekakun Fire APK

on:
  pull_request:
    paths:
      - "fire-tablet-app/**"
      - ".github/workflows/build-dekakun-fire-apk.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Build installable APK
        run: gradle -p fire-tablet-app :app:assembleDebug --no-daemon

      - name: Rename APK
        run: cp fire-tablet-app/app/build/outputs/apk/debug/app-debug.apk fire-tablet-app/Dekakun-Fire.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: dekakun-fire-apk
          path: fire-tablet-app/Dekakun-Fire.apk
          if-no-files-found: error
          retention-days: 30
