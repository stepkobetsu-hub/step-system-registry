name: Remove teacher app link
on:
  push:
    paths:
      - .github/remove-teacher-app-link.trigger
permissions:
  contents: write
jobs:
  remove:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Remove teacher app link from registry
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          old = "if(String(item['システム名']||'').includes('講師ポータル')){const staffAppUrl='https://stepkobetsu-hub.github.io/seiseki-kanri/';const teacherAppUrl='https://stepkobetsu-hub.github.io/teacher_schedule/teacher_app.html';section.append(linkRow('スタッフ用アプリ',staffAppUrl),linkRow('講師アプリ',teacherAppUrl));used.add(staffAppUrl);used.add(teacherAppUrl);}"
          new = "if(String(item['システム名']||'').includes('講師ポータル')){const staffAppUrl='https://stepkobetsu-hub.github.io/seiseki-kanri/';section.append(linkRow('スタッフ用アプリ',staffAppUrl));used.add(staffAppUrl);}"
          if old not in s:
              raise SystemExit('target string not found')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
          PY
          rm -f .github/remove-teacher-app-link.trigger .github/workflows/remove-teacher-app-link.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+users.noreply.github.com'
          git add index.html .github/remove-teacher-app-link.trigger .github/workflows/remove-teacher-app-link.yml
          git commit -m 'fix: remove teacher app link from portal registry'
          git push
