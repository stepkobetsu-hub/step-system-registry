name: Move entry form to juku card

on:
  push:
    paths:
      - '.github/workflows/move-entry-form-to-juku-card.yml'

permissions:
  contents: write

jobs:
  fix-ledger:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Move digital entry form link
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_required(text, old, new, label, count=1):
              actual = text.count(old)
              if actual != count:
                  raise SystemExit(f"unexpected match count for {label}: {actual} != {count}")
              return text.replace(old, new)

          html_path = Path('index.html')
          html = html_path.read_text(encoding='utf-8')

          old = "function organizeEntryImport(items){const list=items.map(item=>Object.assign({},item));const grade=list.find(isGradeSystem);const juku=list.find(isJukuCard);if(grade&&juku){const entryUrl=(grade['読み取りURL']||'').trim();if(entryUrl)juku['読み取りURL']=entryUrl;delete grade['読み取りURL'];grade['システム名']='成績管理';grade['概要']='テスト成績・通知表・志望校・面談メモを管理';juku['システム名']='受付カード・エントリーシート読み取り';juku['概要']='受付カードの登録・一覧管理・印刷・エントリーシート読み取り'}"
          new = "function organizeEntryImport(items){const list=items.map(item=>Object.assign({},item));const grade=list.find(isGradeSystem);const juku=list.find(isJukuCard);if(grade&&juku){const entryUrl=(grade['読み取りURL']||'').trim();if(entryUrl)juku['読み取りURL']=entryUrl;delete grade['読み取りURL'];const entryFormUrl=(grade['入力フォームURL']||'').trim();if(entryFormUrl)juku['入力フォームURL']=entryFormUrl;delete grade['入力フォームURL'];grade['システム名']='成績管理';grade['概要']='テスト成績・通知表・志望校・面談メモを管理';juku['システム名']='受付カード・エントリーシート読み取り';juku['概要']='受付カードの登録・一覧管理・印刷・エントリーシート読み取り'}"
          html = replace_required(html, old, new, 'move input form field')

          old = "function dailyFieldOrder(item){if(isGradeSystem(item))return ['利用者向けURL','管理者向けURL','Google Sheet URL','入力フォームURL'];if(isStudentMaster(item))return ['Google Sheet URL','利用者向けURL','管理者向けURL','入力フォームURL'];return GROUPS.flatMap(g=>g.fields.map(([field,label])=>[field,label])).filter(([field])=>DAILY_FIELDS.has(field))}"
          new = "function dailyFieldOrder(item){if(isGradeSystem(item))return ['利用者向けURL','管理者向けURL','Google Sheet URL'];if(isJukuCard(item))return ['利用者向けURL','読み取りURL','入力フォームURL','Google Sheet URL'];if(isStudentMaster(item))return ['Google Sheet URL','利用者向けURL','管理者向けURL','入力フォームURL'];return GROUPS.flatMap(g=>g.fields.map(([field,label])=>[field,label])).filter(([field])=>DAILY_FIELDS.has(field))}"
          html = replace_required(html, old, new, 'daily link order')

          old = "if(isJukuCard(item)&&field==='利用者向けURL')return '受付カード読み取りアプリを開く';if(isJukuCard(item)&&field==='読み取りURL')return 'エントリーシート読み取りアプリを開く';if(isJukuCard(item)&&field==='Apps Script編集URL')return 'Apps Scriptを開く';"
          new = "if(isJukuCard(item)&&field==='利用者向けURL')return '受付カード読み取りアプリを開く';if(isJukuCard(item)&&field==='読み取りURL')return 'エントリーシート読み取りアプリを開く';if(isJukuCard(item)&&field==='入力フォームURL')return 'エントリーシート（デジタル版）';if(isJukuCard(item)&&field==='Apps Script編集URL')return 'Apps Scriptを開く';"
          html = replace_required(html, old, new, 'juku input form label')

          html_path.write_text(html, encoding='utf-8')

          md_path = Path('SYSTEM_REGISTRY.md')
          md = md_path.read_text(encoding='utf-8')
          old = "| 成績管理 | 本番使用中 | **講師・管理者用:** https://stepkobetsu-hub.github.io/seiseki-kanri/admin.html<br>**生徒用:** https://stepkobetsu-hub.github.io/seiseki-kanri/juku_app.html | [seiseki-kanri](https://github.com/stepkobetsu-hub/seiseki-kanri) | `main` | `admin.html`、`juku_app.html`、`gas_code.js`、端末別ログイン試験（`index.html` はスタッフ用ポータル） | GitHub＋Apps Script | Pagesと既存GASデプロイを同時に整合させる | 2026-08-15 | **成績管理の直接入口は2つ。講師・管理者は `admin.html`、生徒は `juku_app.html`。`/seiseki-kanri/`（`index.html`）はスタッフ用ポータルで、成績管理の直接入口とは区別する** |"
          new = "| 成績管理 | 本番使用中 | **講師・管理者用:** https://stepkobetsu-hub.github.io/seiseki-kanri/admin.html<br>**生徒用:** https://stepkobetsu-hub.github.io/seiseki-kanri/juku_app.html | [seiseki-kanri](https://github.com/stepkobetsu-hub/seiseki-kanri) | `main` | `admin.html`、`juku_app.html`、`gas_code.js`、端末別ログイン試験（`index.html` はスタッフ用ポータル） | GitHub＋Apps Script | Pagesと既存GASデプロイを同時に整合させる | 2026-08-15 | **成績管理の直接入口は2つ。講師・管理者は `admin.html`、生徒は `juku_app.html`。`/seiseki-kanri/`（`index.html`）はスタッフ用ポータルで、成績管理の直接入口とは区別する。エントリーシート（デジタル版）は成績管理カードではなく「受付カード・エントリーシート読み取り」カードに表示する** |"
          md = replace_required(md, old, new, 'grade ledger note')

          old = "| エントリーシート読み取り | 本番使用中 | https://stepkobetsu-hub.github.io/seiseki-kanri/entry_import.html | [seiseki-kanri](https://github.com/stepkobetsu-hub/seiseki-kanri) | `main` | `entry_import.html`、成績管理リポジトリ内一式 | GitHub＋Google Sheet | Pages更新後、対象Sheetとの接続確認 | 2026-07-20 | `entry_import.html`を現行版とする |"
          new = "| エントリーシート読み取り | 本番使用中 | https://stepkobetsu-hub.github.io/seiseki-kanri/entry_import.html | [seiseki-kanri](https://github.com/stepkobetsu-hub/seiseki-kanri) | `main` | `entry_import.html`、成績管理リポジトリ内一式 | GitHub＋Google Sheet | Pages更新後、対象Sheetとの接続確認 | 2026-08-15 | `entry_import.html`を現行版とする。資産管理ページでは「受付カード・エントリーシート読み取り」カードに集約し、「エントリーシート（デジタル版）」も同カードの日常利用に表示する |"
          md = replace_required(md, old, new, 'entry import ledger row')
          md_path.write_text(md, encoding='utf-8')

          final_html = html_path.read_text(encoding='utf-8')
          checks = [
              "if(entryFormUrl)juku['入力フォームURL']=entryFormUrl",
              "delete grade['入力フォームURL']",
              "if(isJukuCard(item))return ['利用者向けURL','読み取りURL','入力フォームURL','Google Sheet URL']",
              "if(isJukuCard(item)&&field==='入力フォームURL')return 'エントリーシート（デジタル版）'",
          ]
          for check in checks:
              if check not in final_html:
                  raise SystemExit(f'missing verification: {check}')
          if "if(isGradeSystem(item))return ['利用者向けURL','管理者向けURL','Google Sheet URL','入力フォームURL']" in final_html:
              raise SystemExit('grade card still includes input form in daily links')
          PY
          git diff --check

      - name: Commit corrected placement
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html SYSTEM_REGISTRY.md
          git diff --cached --quiet && exit 0
          git commit -m "エントリーシート入力を受付カード側へ移動"
          git push origin HEAD:main
