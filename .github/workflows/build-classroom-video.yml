name: Build classroom video
on:
  pull_request:
    paths: ["classroom-video/**", ".github/workflows/build-classroom-video.yml"]
  push:
    branches: [main]
    paths: ["classroom-video/**", ".github/workflows/build-classroom-video.yml"]
permissions:
  contents: write
jobs:
  test:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: classroom-video } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: classroom-video/package-lock.json }
      - run: npm ci
      - run: npm test
      - run: npm run check
  apk:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: classroom-video/android } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.9' }
      - run: gradle assembleDebug
      - uses: actions/upload-artifact@v4
        with: { name: step-classroom-video-debug-apk, path: classroom-video/android/app/build/outputs/apk/debug/app-debug.apk }
      - name: Publish stable Fire APK download
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk STEP-Classroom-Video-Fire.apk
          gh release view classroom-video-fire >/dev/null 2>&1 || gh release create classroom-video-fire --title "STEP Classroom Video Fire" --notes "Fire tablet build"
          gh release upload classroom-video-fire STEP-Classroom-Video-Fire.apk --clobber
