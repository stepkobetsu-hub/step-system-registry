name: Patch learning progress V3 registry

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/patch-learning-progress-v3-registry.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Patch SYSTEM_REGISTRY.md
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p = Path('SYSTEM_REGISTRY.md')
          text = p.read_text(encoding='utf-8')
          text = text.replace('最終更新: 2026-08-20', '最終更新: 2026-08-22', 1)

          new_row = '''| ステップ＆ゴール進捗管理 | 本番（V3・D1直保存） | https://step-progress-api.stepkobetsu.workers.dev/ | [foresta-step-progress](https://github.com/stepkobetsu-hub/foresta-step-progress) | `agent/step-progress-v3-implementation`（V3正本）／`main`（運用ワークフロー） | `cloudflare/src/v3.ts`、`cloudflare/src/dashboard.ts`、`cloudflare/src/summary.ts`、`cloudflare/public/index.html`、`cloudflare/wrangler.v3.production.jsonc` | GitHub＋Cloudflare Worker＋D1 `step-progress-db`。進捗・目標範囲・宿題の編集状態はV3 D1を正本とし、ログイン・未移行管理操作のみ既存Google APIを利用 | 変更は1320等の限定データで確認後、V3 staging→最終スナップショット→本番Workerの順に反映。通常保存でGoogle応答を待たない | 2026-08-22 | 本番Version 92 `0503b822-cc27-4bcf-b15d-4ae16f8fcaed`。進捗707ms、目標889ms、宿題1231ms（サーバー処理）、再読込保持確認済み。最終スナップショット2026-08-22 13:37:31 JST、テストoverride 0件。旧本番Version 91 `7b84a8f6-3b25-4052-ab32-f02d6af55a51` と `agent/cloudflare-progress-migration` を復旧先として維持。詳細は `docs/learning-progress-v3-20260822.md` |'''
          text, count = re.subn(r'^\| ステップ＆ゴール進捗管理 \|.*$', new_row, text, count=1, flags=re.M)
          if count != 1:
              raise SystemExit(f'table row replacement count={count}')

          marker = '## 登録詳細：フォレスタ進捗管理'
          heading = '### 2026-08-22 V3 D1直保存へ本番切替'
          if heading not in text:
              block = f'''\n### 2026-08-22 V3 D1直保存へ本番切替\n\n- 本番URL: https://step-progress-api.stepkobetsu.workers.dev/\n- Worker: `step-progress-api`\n- 本番Version: **92**／Version ID `0503b822-cc27-4bcf-b15d-4ae16f8fcaed`／traffic 100%\n- V3正本ブランチ: `agent/step-progress-v3-implementation`\n- 保存方針: 進捗・目標範囲・宿題の通常編集はCloudflare WorkerからD1へ直接保存し、Google Apps Scriptの応答完了を通常保存の成功条件にしない。\n- D1: 既存 `step-progress-db` 内の `v3_*` 専用テーブルを使用。旧本番テーブルは削除せず、ロールバック用として維持。\n- 最終データコピー: 2026-08-22 13:37:31 JST。生徒34名、進捗1,267件、目標7,011件、宿題2,271件。テストoverride・一時セッションは0件。\n- 自動保存: 進捗300ms debounce、目標350ms debounce。保存ボタンを前提にしない。\n- 1320スモークテスト: 進捗707ms／通信込み979ms、目標889ms／1,166ms、宿題1,231ms／1,452ms。3項目とも保存→再読込保持を確認。\n- 目標範囲識別: `教科 | 教材シリーズ | 単元ID` を基本キーとし、別教材・別教科の同一／類似ID混在による再読込戻りを防止。\n- 本番確認: `/health` は `ok=true`、`mode=d1-isolated-autosave`。\n- staging: https://step-progress-v3-staging.stepkobetsu.workers.dev/ を比較・検証用として維持。\n- ロールバック: V3直前Version 91 `7b84a8f6-3b25-4052-ab32-f02d6af55a51`、旧正本ブランチ `agent/cloudflare-progress-migration`。V3テーブルを削除せずWorkerだけ旧版へ戻せる。\n- 詳細: `docs/learning-progress-v3-20260822.md`。\n\n'''
              if marker not in text:
                  raise SystemExit('detail section marker not found')
              text = text.replace(marker, block + marker, 1)

          p.write_text(text, encoding='utf-8')
          PY
      - name: Commit registry update
        shell: bash
        run: |
          set -e
          if git diff --quiet -- SYSTEM_REGISTRY.md; then
            echo 'No registry changes required.'
            exit 0
          fi
          git config user.name 'stepkobetsu-hub'
          git config user.email 'stepkobetsu@gmail.com'
          git add SYSTEM_REGISTRY.md
          git commit -m 'Record learning progress V3 production cutover'
          git push origin HEAD:main
