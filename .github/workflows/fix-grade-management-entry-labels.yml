name: Fix grade management entry labels

on:
  push:
    paths:
      - '.github/workflows/fix-grade-management-entry-labels.yml'

permissions:
  contents: write

jobs:
  fix-ledger:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Correct grade-management entry labels
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_required(text, old, new, label, count=None):
              actual = text.count(old)
              if actual == 0:
                  raise SystemExit(f"missing expected text: {label}")
              if count is not None and actual != count:
                  raise SystemExit(f"unexpected match count for {label}: {actual} != {count}")
              return text.replace(old, new)

          md_path = Path('SYSTEM_REGISTRY.md')
          md = md_path.read_text(encoding='utf-8')

          old_staff = "| スタッフ用アプリ | 本番使用中 | https://stepkobetsu-hub.github.io/seiseki-kanri/ | [seiseki-kanri](https://github.com/stepkobetsu-hub/seiseki-kanri) | `main` | `index.html`、`gas_code.js` | GitHub＋Apps Script | GitHub Pagesを更新し、GAS変更時は既存デプロイを更新 | 2026-07-22 | `index.html`を現行入口とする |"
          new_staff = "| スタッフ用アプリ | 本番使用中 | https://stepkobetsu-hub.github.io/seiseki-kanri/ | [seiseki-kanri](https://github.com/stepkobetsu-hub/seiseki-kanri) | `main` | `index.html`、`gas_code.js` | GitHub＋Apps Script | GitHub Pagesを更新し、GAS変更時は既存デプロイを更新 | 2026-07-22 | `index.html` はスタッフ用ポータル。成績管理の直接入口ではなく、成績管理へ入る場合は `admin.html` へ進む |"
          md = replace_required(md, old_staff, new_staff, 'staff portal row', 1)

          old_grade = "| 成績管理 | 本番使用中 | https://stepkobetsu-hub.github.io/seiseki-kanri/admin.html | [seiseki-kanri](https://github.com/stepkobetsu-hub/seiseki-kanri) | `main` | `index.html`、`admin.html`、`juku_app.html`、`gas_code.js`、端末別ログイン試験 | GitHub＋Apps Script | Pagesと既存GASデプロイを同時に整合させる | 2026-08-13 | 業務ホームの管理者入口は `admin.html`、生徒入口は `juku_app.html`。管理者・生徒とも端末区分を選択 |"
          new_grade = "| 成績管理 | 本番使用中 | **講師・管理者用:** https://stepkobetsu-hub.github.io/seiseki-kanri/admin.html<br>**生徒用:** https://stepkobetsu-hub.github.io/seiseki-kanri/juku_app.html | [seiseki-kanri](https://github.com/stepkobetsu-hub/seiseki-kanri) | `main` | `admin.html`、`juku_app.html`、`gas_code.js`、端末別ログイン試験（`index.html` はスタッフ用ポータル） | GitHub＋Apps Script | Pagesと既存GASデプロイを同時に整合させる | 2026-08-15 | **成績管理の直接入口は2つ。講師・管理者は `admin.html`、生徒は `juku_app.html`。`/seiseki-kanri/`（`index.html`）はスタッフ用ポータルで、成績管理の直接入口とは区別する** |"
          md = replace_required(md, old_grade, new_grade, 'grade management row', 1)

          md = replace_required(md, "### 2026-08-07 成績管理の管理者・生徒別端末ログイン", "### 2026-08-07 成績管理の講師・管理者・生徒別端末ログイン", 'grade history heading', 1)
          md = replace_required(md, "- 管理者用URL: https://stepkobetsu-hub.github.io/seiseki-kanri/admin.html", "- 講師・管理者用URL: https://stepkobetsu-hub.github.io/seiseki-kanri/admin.html", 'grade staff url history', 1)
          md = replace_required(md, "- 正本: `stepkobetsu-hub/seiseki-kanri` の `main`。管理者用は `admin.html`、生徒用は `juku_app.html`。試験は `admin-device-session.test.mjs`、`student-device-session.test.mjs`。", "- 正本: `stepkobetsu-hub/seiseki-kanri` の `main`。講師・管理者用は `admin.html`、生徒用は `juku_app.html`。`index.html` はスタッフ用ポータルで、成績管理の直接入口ではない。試験は `admin-device-session.test.mjs`、`student-device-session.test.mjs`。", 'grade history source', 1)
          md_path.write_text(md, encoding='utf-8')

          html_path = Path('index.html')
          html = html_path.read_text(encoding='utf-8')

          html = replace_required(
              html,
              "if(isGradeSystem(item))return ['利用者向けURL','GitHub Pages URL','Google Sheet URL','入力フォームURL'];",
              "if(isGradeSystem(item))return ['利用者向けURL','管理者向けURL','Google Sheet URL','入力フォームURL'];",
              'grade daily link order',
              1,
          )

          html = replace_required(
              html,
              "if(name.includes('成績管理'))Object.assign(patch,{'正本ファイル':'index.html / admin.html','最新版の場所':'seiseki-kanri','確認済み事項':['一般入口：index.html','管理者入口：admin.html'],'未確認項目':['保存先Google Sheet','GAS側の保存処理'],'確認状況':'一般・管理者入口確認済み / 保存先Sheet・GAS側処理未確認'});",
              "if(name.includes('成績管理'))Object.assign(patch,{'正本ファイル':'admin.html / juku_app.html（index.html はスタッフ用ポータル）','最新版の場所':'seiseki-kanri','仕様メモ':'成績管理の直接入口は2つ。講師・管理者は admin.html、生徒は juku_app.html。index.html はスタッフ用ポータルで、成績管理への直接入口とは区別する。','確認済み事項':['講師・管理者用直接入口：admin.html','生徒用直接入口：juku_app.html','スタッフ用ポータル：index.html（成績管理の直接入口ではない）'],'未確認項目':['保存先Google Sheet','GAS側の保存処理'],'確認状況':'講師・管理者用／生徒用の直接入口確認済み / 保存先Sheet・GAS側処理未確認'});",
              'base grade asset patch',
              1,
          )

          html = replace_required(
              html,
              "if(isGradeSystem(item)){if(field==='利用者向けURL')return '生徒が成績を入力する';if(field==='管理者向けURL'||field==='GitHub Pages URL')return '成績管理の管理画面を開く';",
              "if(isGradeSystem(item)){if(field==='利用者向けURL')return '生徒用 成績管理を開く';if(field==='管理者向けURL'||field==='GitHub Pages URL')return '講師・管理者用 成績管理を開く';",
              'grade link labels',
              1,
          )

          html = replace_required(
              html,
              "'利用者向けURL':'https://stepkobetsu-hub.github.io/seiseki-kanri/admin.html','保存基盤':'Google Sheet'",
              "'利用者向けURL':'https://stepkobetsu-hub.github.io/seiseki-kanri/juku_app.html','管理者向けURL':'https://stepkobetsu-hub.github.io/seiseki-kanri/admin.html','保存基盤':'Google Sheet'",
              'grade url override',
              1,
          )

          html = replace_required(
              html,
              "'正本ファイル':'index.html / admin.html','最新版の場所':'seiseki-kanri',",
              "'正本ファイル':'admin.html / juku_app.html（index.html はスタッフ用ポータル）','最新版の場所':'seiseki-kanri','仕様メモ':'成績管理の直接入口は2つ。講師・管理者は admin.html、生徒は juku_app.html。index.html はスタッフ用ポータルで、成績管理への直接入口とは区別する。',",
              'confirmed grade source files',
              1,
          )

          html = replace_required(
              html,
              "'確認済み事項':['一般入口：index.html','管理者入口：admin.html','保存先：Google Sheet（成績管理）','Spreadsheet ID・関連シート']",
              "'確認済み事項':['講師・管理者用直接入口：admin.html','生徒用直接入口：juku_app.html','スタッフ用ポータル：index.html（成績管理の直接入口ではない）','保存先：Google Sheet（成績管理）','Spreadsheet ID・関連シート']",
              'confirmed grade entry facts',
              1,
          )

          html_path.write_text(html, encoding='utf-8')

          checks = {
              'index staff label': '講師・管理者用 成績管理を開く',
              'index student label': '生徒用 成績管理を開く',
              'index student url': "'利用者向けURL':'https://stepkobetsu-hub.github.io/seiseki-kanri/juku_app.html'",
              'index staff url': "'管理者向けURL':'https://stepkobetsu-hub.github.io/seiseki-kanri/admin.html'",
              'index portal distinction': 'スタッフ用ポータル：index.html（成績管理の直接入口ではない）',
          }
          final_html = html_path.read_text(encoding='utf-8')
          final_md = md_path.read_text(encoding='utf-8')
          for label, value in checks.items():
              if value not in final_html:
                  raise SystemExit(f'missing verification: {label}')
          if '**講師・管理者用:** https://stepkobetsu-hub.github.io/seiseki-kanri/admin.html' not in final_md:
              raise SystemExit('missing markdown staff URL')
          if '**生徒用:** https://stepkobetsu-hub.github.io/seiseki-kanri/juku_app.html' not in final_md:
              raise SystemExit('missing markdown student URL')
          PY

          git diff --check

      - name: Commit corrected ledger
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add SYSTEM_REGISTRY.md index.html
          git diff --cached --quiet && exit 0
          git commit -m "成績管理の講師・管理者・生徒入口を明確化"
          git push origin HEAD:main
