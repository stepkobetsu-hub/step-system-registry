name: Fix accounting login favicon 20260907

on:
  push:
    paths:
      - '.github/workflows/fix-accounting-favicon-20260907.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply favicon patch
        run: python scripts/fix-accounting-favicon.py
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/fix-accounting-favicon-20260907.yml scripts/fix-accounting-favicon.py
          git add -A
          git diff --cached --quiet || git commit -m "Attach accounting login favicon"
          git push
